<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>You're offline - Mindarr</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-image: radial-gradient(circle at 20% 0%, rgba(245, 158, 11, 0.08), transparent 40%),
                              radial-gradient(circle at 80% 100%, rgba(99, 102, 241, 0.08), transparent 40%);
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.35);
        }
        .icon-badge {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f59e0b, #facc15);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-badge svg { width: 28px; height: 28px; fill: #111827; }
        h1 { font-size: 18px; font-weight: 700; margin: 0 0 8px; color: #fff; }
        p { font-size: 14px; color: #94a3b8; margin: 0 0 24px; line-height: 1.5; }
        button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: #f59e0b;
            color: #0b0f19;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button:hover { background: #fbbf24; }
        .brand { font-weight: 700; font-size: 15px; margin-top: 20px; color: #64748b; }
        .brand span { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-badge">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        <h1>You're offline</h1>
        <p>Mindarr can't reach the server right now. Check your connection and try again — anything you've already loaded may still be available.</p>
        <button onclick="retry()">Retry connection</button>
        <div class="brand">Mind<span>arr</span></div>
    </div>
    <script>
        function retry() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                window.location.href = '/';
            }
        }
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
