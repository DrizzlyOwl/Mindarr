name: Docker Build

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=sha
        type=raw,value=latest
      cache: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  tag-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: version
        run: |
          set -euo pipefail

          NEW_VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('plex_recommender/__init__.py').read()).group(1))")
          PYPROJECT_VERSION=$(python3 -c "import re; print(re.search(r'(?m)^version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")

          if [ "$NEW_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::__version__ ($NEW_VERSION) in plex_recommender/__init__.py does not match [project] version ($PYPROJECT_VERSION) in pyproject.toml"
            exit 1
          fi

          if ! git cat-file -e HEAD~1 2>/dev/null; then
            echo "No parent commit to diff against; skipping tag/release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show HEAD~1:plex_recommender/__init__.py | python3 -c "import re, sys; m = re.search(r'__version__ = \"([^\"]+)\"', sys.stdin.read()); print(m.group(1) if m else '')")

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "Version unchanged ($NEW_VERSION); skipping tag/release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${NEW_VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on origin; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bumped: ${OLD_VERSION} -> ${NEW_VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
