[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-recommender"
version = "1.4.1"
description = "Mindarr - watch-history analyzer and unseen content discovery engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "plexapi>=4.15.15",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.1.2",
    "apscheduler>=3.10.4",
    "urllib3<3.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
