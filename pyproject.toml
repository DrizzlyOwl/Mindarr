[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-recommender"
version = "1.9.1"
description = "Mindarr - watch-history analyzer and unseen content discovery engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "plexapi>=4.15.15",
    "requests>=2.32.4",
    "fastapi>=0.115.0",
    "starlette>=0.47.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.1.2",
    "apscheduler>=3.10.4",
    "urllib3>=2.5.0,<3.0.0",
    "certifi>=2025.1.31"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]
